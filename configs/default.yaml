project:
  name: CrossCam
  mode: recorded_replay
  random_seed: 42

runtime:
  target_sample_fps: 5
  max_queue_size: 8
  frame_width: 640
  device: auto
  association_device: cpu

association:
  accept_threshold: 0.78
  defer_threshold: 0.55
  min_margin: 0.08
  widen_search_if_weak: true
  widen_if_best_score_below: 0.78
  widen_search_horizon_seconds: 180
  time_decay_seconds: 90

cameras:
  - id: cam_01
    label: Camera 1
  - id: cam_02
    label: Camera 2
  - id: cam_03
    label: Camera 3
  - id: cam_04
    label: Camera 4

transitions:
  - from: cam_01
    to: cam_02
    min_seconds: 2
    max_seconds: 45
  - from: cam_02
    to: cam_03
    min_seconds: 3
    max_seconds: 60
  - from: cam_03
    to: cam_04
    min_seconds: 2
    max_seconds: 50
  - from: cam_02
    to: cam_01
    min_seconds: 2
    max_seconds: 45
  - from: cam_03
    to: cam_02
    min_seconds: 3
    max_seconds: 60
  - from: cam_04
    to: cam_03
    min_seconds: 2
    max_seconds: 50

# Unlisted camera pairs remain "unknown"; no overlap/non-overlap assumptions
# are inferred from the absence of a transition edge.
camera_relationships: []
